name: Validate log rotation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install logrotate
        run: sudo apt-get update && sudo apt-get install -y logrotate
      - name: Validate shell syntax
        run: bash -n scripts/custom_rotate.sh tests/test_logrotation.sh
      - name: Run smoke test
        run: ./tests/test_logrotation.sh
      - name: Validate production config
        run: sudo logrotate -d config/myapp.logrotate
